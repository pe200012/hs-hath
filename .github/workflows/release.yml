name: Release

on:
  push:
    tags:
      - "v*.*.*"

# only the release job writes; the build job runs other people's actions
permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        # oldest supported runner, so the binaries run on older glibc (22.04 = 2.35)
        os: [ubuntu-22.04]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v2

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt install libsqlite3-dev

      - name: Setup LLVM
        uses: ZhongRuoyu/setup-llvm@eea6238baf53d41c1615923680d7a738da584318 # v0.2.0
        with:
          llvm-version: 19

      - name: Install Stack
        run: |
          curl -sSL https://get.haskellstack.org/ | sh -s - -f

      - uses: actions/cache@v4
        if: runner.os != 'macOS'
        with:
          path: |
            ~/.stack
            .stack-work
          key: ${{ runner.os }}-stack-${{ matrix.plan.ghc }}-${{ hashFiles('stack-release.yaml') }}
          restore-keys: |
            ${{ runner.os }}-stack-${{ matrix.plan.ghc }}-
            ${{ runner.os }}-stack-

      - name: Build
        run: |
          stack install --stack-yaml stack-release.yaml --local-bin-path ./bin/

      - name: Compress binaries (Unix)
        if: runner.os != 'Windows'
        uses: crazy-max/ghaction-upx@db8cc9515a4a7ea1b312cb82fbeae6d716daf777 # v3.2.0
        with:
          version: latest
          files: ./bin/*
          args: -fq

      - name: Package binaries
        run: |
          version="${GITHUB_REF#refs/tags/}"
          cd bin
          tar -czf ../hs-hath-${version}-${{ matrix.os }}.tar.gz *

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hs-hath-${{ matrix.os }}
          path: "hs-hath-*.tar.gz"

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v2

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List assets
        id: asset_names
        run: |
          cd artifacts
          assets=$(ls hs-hath-*.tar.gz | tr '\n' ' ')
          echo "LIST=${assets}" >> $GITHUB_OUTPUT

      - name: Check if pre-release
        id: is_pre_release
        run: |
          version="${GITHUB_REF#refs/tags/}"
          if [[ "${version}" =~ -.*$ ]]; then
            echo "IS_PRERELEASE=true" >> $GITHUB_OUTPUT
          else
            echo "IS_PRERELEASE=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: docker://antonyurchenko/git-release@sha256:b3a7d6a87981f8ed455e6b44c702e55afd95b3e628c324d7fd4f6f85728f792b # v6.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRAFT_RELEASE: "false"
          PRE_RELEASE: ${{ steps.is_pre_release.outputs.IS_PRERELEASE }}
          CHANGELOG_FILE: "CHANGELOG.md"
          ALLOW_EMPTY_CHANGELOG: "false"
        with:
          args: |
            artifacts/${{ steps.asset_names.outputs.LIST }}
